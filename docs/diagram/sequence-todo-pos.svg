<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1180" width="1520" height="1180" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1520" height="1180" fill="#faf7f2"/>

  <text x="760" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">Sequence Diagram — Checkout dari QR Meja</text>
  <text x="760" y="71" text-anchor="middle" font-size="14.5" fill="#78716c">Jalur teknis satu pesanan: dari pindaian sampai muncul otomatis di layar kasir</text>

  <!-- ══ Partisipan ══ -->
  <g filter="url(#f)">
    <rect x="40" y="100" width="170" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="266" y="100" width="200" height="54" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="516" y="100" width="200" height="54" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="782" y="100" width="210" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="1042" y="100" width="180" height="54" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="1278" y="100" width="200" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>

  <text x="125" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">Pelanggan</text>
  <text x="125" y="141" text-anchor="middle" font-size="12" fill="#a16207">di meja 07</text>

  <text x="366" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">Halaman Menu</text>
  <text x="366" y="141" text-anchor="middle" font-size="12" fill="#64748b">React Client Component</text>

  <text x="616" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">createOrder()</text>
  <text x="616" y="141" text-anchor="middle" font-size="12" fill="#64748b">Next.js Server Action</text>

  <text x="887" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">PostgreSQL</text>
  <text x="887" y="141" text-anchor="middle" font-size="12" fill="#047857">fungsi create_order()</text>

  <text x="1132" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4c1d95">Realtime</text>
  <text x="1132" y="141" text-anchor="middle" font-size="12" fill="#7c3aed">Supabase</text>

  <text x="1378" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Layar Kasir</text>
  <text x="1378" y="141" text-anchor="middle" font-size="12" fill="#2563eb">tab lain, sudah terbuka</text>

  <!-- ══ Garis hidup ══ -->
  <g stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="125" y1="154" x2="125" y2="876"/>
    <line x1="366" y1="154" x2="366" y2="876"/>
    <line x1="616" y1="154" x2="616" y2="876"/>
    <line x1="887" y1="154" x2="887" y2="876"/>
    <line x1="1132" y1="154" x2="1132" y2="1010"/>
    <line x1="1378" y1="154" x2="1378" y2="1010"/>
  </g>

  <!-- ══ Batang aktivasi ══ -->
  <rect x="359" y="196" width="14" height="576" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <rect x="609" y="382" width="14" height="332" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <rect x="880" y="470" width="14" height="352" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <rect x="1125" y="822" width="14" height="52" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="1371" y="866" width="14" height="108" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>

  <!-- ══ Pesan ══ -->
  <g stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#s)">
    <line x1="125" y1="205" x2="356" y2="205"/>
  </g>
  <text x="240" y="197" text-anchor="middle" font-size="12.5" fill="#334155">pindai QR meja</text>
  <text x="240" y="182" text-anchor="middle" font-size="11.5" font-style="italic" fill="#78716c">/k/to-do/meja?meja=07</text>

  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#s)" stroke-dasharray="7 4">
    <line x1="356" y1="247" x2="129" y2="247"/>
  </g>
  <text x="243" y="239" text-anchor="middle" font-size="12.5" fill="#334155">menu tampil — nomor meja 07 terkunci</text>

  <g stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#s)">
    <line x1="125" y1="296" x2="356" y2="296"/>
  </g>
  <text x="240" y="288" text-anchor="middle" font-size="12.5" fill="#334155">pilih item, isi nama, checkout</text>

  <!-- self: validasi klien -->
  <path d="M 373 330 h 52 v 30 h -52" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <text x="435" y="342" font-size="12" fill="#475569">validasi sisi klien</text>
  <text x="435" y="357" font-size="11.5" font-style="italic" fill="#78716c">sekadar kenyamanan, bukan pengaman</text>

  <g stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#s)">
    <line x1="373" y1="392" x2="606" y2="392"/>
  </g>
  <text x="490" y="384" text-anchor="middle" font-size="12.5" fill="#334155">createOrder(slug, meja, item, nama, bayar)</text>

  <!-- self: validasi server -->
  <path d="M 623 420 h 52 v 30 h -52" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <text x="685" y="432" font-size="12" fill="#475569">rate limit + validasi ulang</text>
  <text x="685" y="447" font-size="11.5" font-style="italic" fill="#78716c">di sinilah pengaman yang sebenarnya</text>

  <g stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#sg)">
    <line x1="623" y1="480" x2="877" y2="480"/>
  </g>
  <text x="750" y="472" text-anchor="middle" font-size="12.5" fill="#047857">rpc create_order(...)</text>

  <!-- self PostgreSQL -->
  <path d="M 894 508 h 52 v 28 h -52" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#sg)"/>
  <text x="956" y="519" font-size="12" font-weight="700" fill="#065f46">BEGIN — kunci baris produk</text>
  <text x="956" y="534" font-size="11.5" font-style="italic" fill="#059669">SELECT ... FOR UPDATE</text>

  <path d="M 894 562 h 52 v 28 h -52" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#sg)"/>
  <text x="956" y="573" font-size="12" fill="#065f46">periksa stok, lalu kurangi</text>
  <text x="956" y="588" font-size="11.5" font-style="italic" fill="#059669">stok kurang → seluruh transaksi dibatalkan</text>

  <path d="M 894 616 h 52 v 28 h -52" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#sg)"/>
  <text x="956" y="627" font-size="12" fill="#065f46">simpan transactions + transaction_items</text>
  <text x="956" y="642" font-size="11.5" font-style="italic" fill="#059669">status pending · harga disalin sebagai snapshot</text>

  <path d="M 894 670 h 52 v 28 h -52" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#sg)"/>
  <text x="956" y="681" font-size="12" fill="#065f46">refresh_table_status()</text>
  <text x="956" y="696" font-size="11.5" font-style="italic" fill="#059669">meja 07 → occupied · COMMIT</text>

  <g stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#sg)" stroke-dasharray="7 4">
    <line x1="877" y1="728" x2="627" y2="728"/>
  </g>
  <text x="752" y="720" text-anchor="middle" font-size="12.5" fill="#047857">invoice_no</text>

  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#s)" stroke-dasharray="7 4">
    <line x1="606" y1="762" x2="377" y2="762"/>
  </g>
  <text x="492" y="754" text-anchor="middle" font-size="12.5" fill="#334155">arahkan ke /struk/INV-…</text>

  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#s)" stroke-dasharray="7 4">
    <line x1="356" y1="800" x2="129" y2="800"/>
  </g>
  <text x="243" y="792" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">struk digital terbit</text>

  <!-- ══ Jalur realtime ══ -->
  <line x1="60" y1="832" x2="1480" y2="832" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="60" y="818" width="196" height="26" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="158" y="836" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">berjalan sendiri, paralel</text>

  <g stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#s)">
    <line x1="894" y1="862" x2="1122" y2="862"/>
  </g>
  <text x="1008" y="854" text-anchor="middle" font-size="12.5" fill="#6d28d9">event WAL: INSERT transactions</text>

  <g stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#s)">
    <line x1="1139" y1="900" x2="1368" y2="900"/>
  </g>
  <text x="1253" y="892" text-anchor="middle" font-size="12.5" fill="#6d28d9">siarkan ke pelanggan tenant</text>

  <path d="M 1385 920 h 46 v 26 h -46" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <text x="1362" y="938" text-anchor="end" font-size="12" fill="#1e3a8a">debounce 400 ms → router.refresh()</text>

  <g filter="url(#f)">
    <rect x="1268" y="978" width="222" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="1379" y="1000" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">pesanan tampil tanpa refresh manual</text>

  <!-- ══ Catatan ══ -->
  <g filter="url(#f)">
    <rect x="40" y="880" width="330" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="56" y="904" font-size="13" font-weight="700" fill="#065f46">Semuanya satu transaksi database</text>
  <text x="56" y="924" font-size="12" fill="#047857">Kurangi stok, simpan pesanan, dan ubah status</text>
  <text x="56" y="941" font-size="12" fill="#047857">meja terjadi sekaligus. Gagal di tengah berarti</text>
  <text x="56" y="958" font-size="12" fill="#047857">semuanya dibatalkan — tidak ada stok yang</text>
  <text x="56" y="975" font-size="12" fill="#047857">berkurang tanpa pesanan yang tercatat.</text>

  <g filter="url(#f)">
    <rect x="404" y="880" width="330" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  <text x="420" y="904" font-size="13" font-weight="700" fill="#991b1b">Bila stok tidak mencukupi</text>
  <text x="420" y="924" font-size="12" fill="#b91c1c">Fungsi database melempar kesalahan, transaksi</text>
  <text x="420" y="941" font-size="12" fill="#b91c1c">dibatalkan, dan pesannya sampai ke pelanggan</text>
  <text x="420" y="958" font-size="12" fill="#b91c1c">lengkap dengan nama produk serta sisa stok —</text>
  <text x="420" y="975" font-size="12" fill="#b91c1c">tanpa ada baris yang tertinggal separuh jadi.</text>

  <g filter="url(#f)">
    <rect x="768" y="880" width="330" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="784" y="904" font-size="13" font-weight="700" fill="#334155">Kalau Realtime putus</text>
  <text x="784" y="924" font-size="12" fill="#475569">Layar kasir tetap melakukan polling berkala</text>
  <text x="784" y="941" font-size="12" fill="#475569">sebagai jaring pengaman, dan berhenti saat</text>
  <text x="784" y="958" font-size="12" fill="#475569">tabnya tidak dilihat. Sambungan yang mati</text>
  <text x="784" y="975" font-size="12" fill="#475569">diam-diam tidak membuat pesanan terlewat.</text>

  <!-- ══ Keterangan ══ -->
  <g filter="url(#f)">
    <rect x="40" y="1032" width="1058" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  </g>
  <text x="64" y="1063" font-size="12.5" font-weight="700" fill="#44403c">KETERANGAN</text>
  <line x1="182" y1="1058" x2="240" y2="1058" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="250" y="1063" font-size="12.5" fill="#57534e">panggilan</text>
  <line x1="340" y1="1058" x2="398" y2="1058" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#s)"/>
  <text x="408" y="1063" font-size="12.5" fill="#57534e">jawaban</text>
  <path d="M 494 1048 h 30 v 20 h -30" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <text x="538" y="1063" font-size="12.5" fill="#57534e">proses internal</text>
  <rect x="660" y="1046" width="12" height="26" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="684" y="1063" font-size="12.5" fill="#57534e">sedang aktif</text>
  <rect x="790" y="1048" width="16" height="16" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="814" y="1063" font-size="12.5" fill="#57534e">database</text>
  <rect x="900" y="1048" width="16" height="16" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="924" y="1063" font-size="12.5" fill="#57534e">realtime</text>
  <rect x="1000" y="1048" width="16" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1024" y="1063" font-size="12.5" fill="#57534e">kasir</text>
</svg>
