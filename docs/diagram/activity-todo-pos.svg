<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1230" width="1440" height="1230" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1440" height="1230" fill="#faf7f2"/>

  <text x="720" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">Activity Diagram — Alur Pemesanan QR</text>
  <text x="720" y="71" text-anchor="middle" font-size="14.5" fill="#78716c">Dari pelanggan memindai QR di meja sampai pesanan lunas</text>

  <!-- ══ Swimlane ══ -->
  <rect x="40" y="96" width="330" height="1100" fill="#fffbeb" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="370" y="96" width="380" height="1100" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="750" y="96" width="340" height="1100" fill="#eff6ff" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="1090" y="96" width="310" height="1100" fill="#f5f3ff" stroke="#d6d3d1" stroke-width="1.5"/>

  <rect x="40" y="96" width="330" height="44" fill="#fde68a" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="370" y="96" width="380" height="44" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="750" y="96" width="340" height="44" fill="#bfdbfe" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="1090" y="96" width="310" height="44" fill="#ddd6fe" stroke="#d6d3d1" stroke-width="1.5"/>

  <text x="205" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">PELANGGAN</text>
  <text x="560" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#44403c">SISTEM</text>
  <text x="920" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">KASIR</text>
  <text x="1245" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">DAPUR</text>

  <!-- ══ Mulai ══ -->
  <circle cx="205" cy="180" r="15" fill="#292524"/>

  <!-- A1 -->
  <g filter="url(#sh)"><rect x="80" y="215" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/></g>
  <text x="205" y="247" text-anchor="middle" font-size="14.5" fill="#78350f">Pindai QR di meja</text>

  <!-- S1 -->
  <g filter="url(#sh)"><rect x="435" y="215" width="250" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/></g>
  <text x="560" y="238" text-anchor="middle" font-size="14" fill="#334155">Buka halaman outlet —</text>
  <text x="560" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">nomor meja terkunci dari URL</text>

  <!-- A2 -->
  <g filter="url(#sh)"><rect x="80" y="305" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/></g>
  <text x="205" y="337" text-anchor="middle" font-size="14.5" fill="#78350f">Pilih menu, isi keranjang</text>

  <!-- A3 -->
  <g filter="url(#sh)"><rect x="80" y="395" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/></g>
  <text x="205" y="418" text-anchor="middle" font-size="14" fill="#78350f">Isi nama &amp; metode bayar,</text>
  <text x="205" y="436" text-anchor="middle" font-size="14" fill="#78350f">lalu checkout</text>

  <!-- D1 keputusan validasi -->
  <g filter="url(#sh)"><path d="M 560 385 L 660 421 L 560 457 L 460 421 Z" fill="#ffffff" stroke="#64748b" stroke-width="2"/></g>
  <text x="560" y="416" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Validasi server</text>
  <text x="560" y="433" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">lolos?</text>

  <!-- error validasi -->
  <g filter="url(#sh)"><rect x="435" y="305" width="250" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/></g>
  <text x="560" y="333" text-anchor="middle" font-size="13.5" fill="#991b1b">Tampilkan pesan kesalahan</text>

  <!-- S2 kunci baris -->
  <g filter="url(#sh)"><rect x="435" y="495" width="250" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/></g>
  <text x="560" y="518" text-anchor="middle" font-size="14" fill="#334155">Kunci baris produk</text>
  <text x="560" y="536" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">SELECT ... FOR UPDATE</text>

  <!-- D2 keputusan stok -->
  <g filter="url(#sh)"><path d="M 560 580 L 655 613 L 560 646 L 465 613 Z" fill="#ffffff" stroke="#64748b" stroke-width="2"/></g>
  <text x="560" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Stok cukup?</text>

  <!-- error stok -->
  <g filter="url(#sh)"><rect x="80" y="590" width="250" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/></g>
  <text x="205" y="611" text-anchor="middle" font-size="13.5" fill="#991b1b">Pesanan dibatalkan —</text>
  <text x="205" y="628" text-anchor="middle" font-size="13.5" fill="#991b1b">stok tidak mencukupi</text>

  <!-- S3 simpan -->
  <g filter="url(#sh)"><rect x="425" y="680" width="270" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/></g>
  <text x="560" y="703" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Satu transaksi database</text>
  <text x="560" y="721" text-anchor="middle" font-size="13" fill="#047857">Kurangi stok · simpan pesanan</text>
  <text x="560" y="738" text-anchor="middle" font-size="13" fill="#047857">status pending · meja jadi terisi</text>

  <!-- S4 realtime -->
  <g filter="url(#sh)"><rect x="435" y="785" width="250" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/></g>
  <text x="560" y="808" text-anchor="middle" font-size="14" fill="#334155">Siarkan perubahan</text>
  <text x="560" y="826" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">Supabase Realtime</text>

  <!-- K1 -->
  <g filter="url(#sh)"><rect x="795" y="785" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/></g>
  <text x="920" y="808" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Pesanan muncul sendiri</text>
  <text x="920" y="826" text-anchor="middle" font-size="13" fill="#2563eb">tanpa refresh manual</text>

  <!-- K2 -->
  <g filter="url(#sh)"><rect x="795" y="870" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/></g>
  <text x="920" y="893" text-anchor="middle" font-size="14" fill="#1e3a8a">Teruskan ke dapur</text>
  <text x="920" y="911" text-anchor="middle" font-size="13" fill="#2563eb">status → diproses</text>

  <!-- Dapur 1 -->
  <g filter="url(#sh)"><rect x="1120" y="870" width="250" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/></g>
  <text x="1245" y="902" text-anchor="middle" font-size="14.5" fill="#4c1d95">Siapkan pesanan</text>

  <!-- Dapur 2 -->
  <g filter="url(#sh)"><rect x="1120" y="955" width="250" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/></g>
  <text x="1245" y="978" text-anchor="middle" font-size="14" fill="#4c1d95">Tandai siap diantar</text>
  <text x="1245" y="996" text-anchor="middle" font-size="13" fill="#7c3aed">status → siap</text>

  <!-- K3 antar -->
  <g filter="url(#sh)"><rect x="795" y="1040" width="250" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/></g>
  <text x="920" y="1068" text-anchor="middle" font-size="14.5" fill="#1e3a8a">Antar ke meja pelanggan</text>

  <!-- A4 bayar -->
  <g filter="url(#sh)"><rect x="80" y="1040" width="250" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/></g>
  <text x="205" y="1068" text-anchor="middle" font-size="14.5" fill="#78350f">Terima pesanan &amp; bayar</text>

  <!-- K4 lunas -->
  <g filter="url(#sh)"><rect x="795" y="1120" width="250" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/></g>
  <text x="920" y="1148" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Tandai lunas</text>

  <!-- S5 selesai -->
  <g filter="url(#sh)"><rect x="435" y="1120" width="250" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/></g>
  <text x="560" y="1141" text-anchor="middle" font-size="13.5" fill="#065f46">Meja kembali kosong,</text>
  <text x="560" y="1158" text-anchor="middle" font-size="13.5" fill="#065f46">struk final terbit</text>

  <!-- Selesai -->
  <circle cx="205" cy="1143" r="17" fill="none" stroke="#292524" stroke-width="2.5"/>
  <circle cx="205" cy="1143" r="10" fill="#292524"/>

  <!-- ══ Panah alur ══ -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="205" y1="196" x2="205" y2="212"/>
    <line x1="330" y1="241" x2="432" y2="241"/>
    <path d="M 560 267 L 560 285 L 360 285 L 360 328 L 332 328"/>
    <line x1="205" y1="357" x2="205" y2="392"/>
    <line x1="330" y1="421" x2="457" y2="421"/>
    <line x1="560" y1="457" x2="560" y2="492"/>
    <line x1="560" y1="547" x2="560" y2="577"/>
    <line x1="560" y1="646" x2="560" y2="677"/>
    <line x1="560" y1="750" x2="560" y2="782"/>
    <line x1="685" y1="811" x2="792" y2="811"/>
    <line x1="920" y1="837" x2="920" y2="867"/>
    <line x1="1045" y1="896" x2="1117" y2="896"/>
    <line x1="1245" y1="922" x2="1245" y2="952"/>
    <path d="M 1245 1007 L 1245 1063 L 1048 1063"/>
    <line x1="795" y1="1063" x2="333" y2="1063"/>
    <path d="M 205 1086 L 205 1103 L 920 1103 L 920 1117"/>
    <line x1="795" y1="1143" x2="688" y2="1143"/>
    <line x1="435" y1="1143" x2="225" y2="1143"/>
  </g>

  <!-- cabang gagal -->
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arRed)" stroke-dasharray="7 5">
    <path d="M 560 385 L 560 354"/>
    <path d="M 465 613 L 333 613"/>
  </g>
  <!-- balik ke pelanggan setelah error -->
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arRed)" stroke-dasharray="7 5">
    <path d="M 435 328 L 400 328 L 400 372 L 250 372 L 250 390"/>
    <path d="M 205 588 L 205 455"/>
  </g>

  <!-- label cabang -->
  <text x="576" y="372" font-size="13" font-weight="700" fill="#dc2626">tidak</text>
  <text x="576" y="480" font-size="13" font-weight="700" fill="#059669">ya</text>
  <text x="392" y="604" font-size="13" font-weight="700" fill="#dc2626">tidak</text>
  <text x="576" y="668" font-size="13" font-weight="700" fill="#059669">ya</text>

  <!-- ══ Catatan ══ -->
  <g filter="url(#sh)"><rect x="700" y="470" width="330" height="92" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/></g>
  <text x="716" y="494" font-size="13" font-weight="700" fill="#065f46">Kenapa baris produk dikunci</text>
  <text x="716" y="513" font-size="12" fill="#047857">Dua meja bisa memesan item terakhir pada</text>
  <text x="716" y="530" font-size="12" fill="#047857">detik yang sama. Tanpa kunci baris, keduanya</text>
  <text x="716" y="547" font-size="12" fill="#047857">lolos dan stok jadi minus.</text>

  <g filter="url(#sh)"><rect x="700" y="600" width="330" height="92" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/></g>
  <text x="716" y="624" font-size="13" font-weight="700" fill="#78350f">Bayar di akhir, bukan di depan</text>
  <text x="716" y="643" font-size="12" fill="#a16207">Pesanan berstatus pending sampai lunas, jadi</text>
  <text x="716" y="660" font-size="12" fill="#a16207">satu meja bisa memesan berkali-kali dan</text>
  <text x="716" y="677" font-size="12" fill="#a16207">membayar sekali di akhir.</text>

  <g filter="url(#sh)"><rect x="75" y="700" width="272" height="126" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/></g>
  <text x="91" y="724" font-size="13" font-weight="700" fill="#334155">Tahap yang terekam sistem</text>
  <text x="91" y="746" font-size="12.5" fill="#b45309">● pending — menunggu diproses</text>
  <text x="91" y="765" font-size="12.5" fill="#2563eb">● diproses — sedang dibuat</text>
  <text x="91" y="784" font-size="12.5" fill="#7c3aed">● siap — siap diantar</text>
  <text x="91" y="803" font-size="12.5" fill="#059669">● paid — lunas</text>
  <text x="91" y="820" font-size="12" font-style="italic" fill="#64748b">cancelled dapat terjadi sebelum lunas</text>
</svg>
